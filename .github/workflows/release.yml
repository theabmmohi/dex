name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > theabmmohi.keystore

      - name: Build signed release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: ./gradlew assembleRelease

      - name: Name the APK and write checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk "dex-${GITHUB_REF_NAME}.apk"
          sha256sum "dex-${GITHUB_REF_NAME}.apk" > "dex-${GITHUB_REF_NAME}.apk.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dex-${{ github.ref_name }}.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dex-* --generate-notes --verify-tag
